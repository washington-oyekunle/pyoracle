[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyoracle"
version = "0.1.0"
description = "Pure Python decentralized oracle aggregator with consensus and reputation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Uthman Washington Oyekunle"}]
keywords = ["oracle", "defi", "consensus", "price-feed", "blockchain", "python"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
pyoracle = "pyoracle.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyoracle*"]
